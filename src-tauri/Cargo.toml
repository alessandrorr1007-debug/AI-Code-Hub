[package]
name = "ai-code-hub"
version = "0.1.0"
description = "AI Code Hub - entorno de desarrollo ligero"
authors = ["AI Code Hub"]
edition = "2021"

[lib]
name = "ai_code_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
